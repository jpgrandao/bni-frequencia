version: "3.8"

services:
  bni-frequencia:
    image: ghcr.io/jpgrandao/bni-frequencia:latest
    volumes:
      - bni_data:/app/data
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - TZ=America/Sao_Paulo
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bni-frequencia
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  bni_data:
